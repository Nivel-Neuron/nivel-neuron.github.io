# 니벨아레나 뉴런 - 카드 자동 업데이트
# 매일 새벽 4시 7분(한국 시간)에 공식 사이트에서 새 카드 정보와 카드 이미지, 공식 Q&A(재정)를 가져와서 저장소에 올림
# Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수도 있음

name: 카드 자동 업데이트

on:
  schedule:
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "이번에 읽을 새 게시글 수 (0 = 전부, 시험할 때만 숫자)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: card-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이미지 도구 설치
        run: pip install pillow

      - name: 공식 사이트에서 카드 가져오기
        env:
          MAX_NEW: ${{ github.event.inputs.max_new }}
        run: |
          cat > /tmp/update_cards.py <<'PY'
          # 니벨아레나 뉴런 - 공식 사이트에서 새 카드 정보와 카드 이미지를 자동으로 가져오는 프로그램
          # 깃허브 Actions 에서 매일 한 번 실행됨
          import html, io, json, os, re, sys, time, urllib.request
          from PIL import Image

          BASE = "http://nivelarena.co.kr"
          ROOT = os.environ.get("REPO_ROOT", ".")
          INDEX = os.path.join(ROOT, "index.html")
          IMG_DIR = os.path.join(ROOT, "cards")
          MAP_FILE = os.path.join(IMG_DIR, "wr_map.json")
          TEXT_FILE = os.path.join(IMG_DIR, "text.json")                 # 카드 효과 글
          ICON_DIR = os.path.join(IMG_DIR, "icons")                      # 효과 글 속 키워드 아이콘 그림 (공식 사이트 그대로)
          ICON_FILE = os.path.join(IMG_DIR, "icons.json")                # 아이콘 이름 → 그림 파일
          MAX_NEW = int(os.environ.get("MAX_NEW") or 0)        # 0 = 제한 없음 (시험할 때만 숫자)
          IMG_MAX = 260                                         # 이미지 긴 변 크기(px)
          LEADER_IMG_MAX = 400                                  # 리더 이미지 긴 변 크기(px) - 가로로 크게 보여서 조금 크게
          SLEEP = 1.0                                           # 요청 간격(초) - 사이트에 부담 안 주게 천천히

          TYPE = {"리더": "리", "유닛": "유", "스킬": "스", "아이템": "아"}
          ATTR = {"화염": "화", "대지": "대", "폭풍": "폭", "파도": "파", "번개": "번"}
          IP_NAMES = ["승리의 여신: 니케", "블루 아카이브", "이터널 리턴", "브라운더스트2", "스텔라 블레이드", "에픽세븐", "기타"]

          log_lines = []
          def log(s):
              print(s, flush=True); log_lines.append(s)

          def get(url, binary=False):
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (NivelNeuron card sync)"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = r.read()
                      time.sleep(SLEEP)
                      return data if binary else data.decode("utf-8", "replace")
                  except Exception as e:
                      log(f"    요청 오류 ({i + 1}/3): {type(e).__name__}: {str(e)[:150]}")
                      if i == 2: raise
                      time.sleep(10 * (i + 1))

          def clean(s):
              s = re.sub(r"<[^>]+>", "", s)
              return html.unescape(s).replace("\xa0", " ").strip()

          def cell(page, label):
              m = re.search(r"<td\s+class=['\"]h3['\"]>\s*" + label + r"\s*</td>\s*<td[^>]*>(.*?)</td>", page, re.S)
              return clean(m.group(1)) if m else ""

          def num(s):
              s = s.replace(",", "").strip()
              return s if re.fullmatch(r"\d+", s) else ""

          # 효과 글 HTML → 앱에서 안전하게 그릴 수 있는 글자 형식
          #   ⟦아이콘 이름⟧ = 아이콘(그림) 자리, **굵게**, 줄바꿈 = 줄 나눔, 줄 맨 앞 "@T " = 트리거 칸
          def effect_text(content):
              t = content.replace("\r", "")
              t = re.sub(r"<p[^>]*triger_box[^>]*>", "\n@T ", t)
              t = re.sub(r"</p\s*>", "\n@E\n", t)
              t = re.sub(r"<br\s*/?>", "\n", t)
              t = re.sub(r"<img[^>]*?alt=['\"]([^'\"]*)['\"][^>]*>", lambda m: "⟦" + m.group(1).strip() + "⟧" if m.group(1).strip() else "", t)
              t = re.sub(r"<b[^>]*>(.*?)</b\s*>", lambda m: "**" + m.group(1) + "**" if m.group(1).strip() else m.group(1), t, flags=re.S)
              t = re.sub(r"<[^>]+>", "", t)
              t = html.unescape(t).replace("\xa0", " ")
              lines, trig = [], False
              for ln in t.split("\n"):
                  ln = re.sub(r"[ \t]+", " ", ln).strip()
                  if ln == "@E":
                      trig = False; continue
                  if ln.startswith("@T"):
                      trig = True; ln = ln[2:].strip()
                  if not ln: continue
                  if trig: ln = "@T " + ln                      # 트리거 칸 안의 줄
                  lines.append(ln)
              return "\n".join(lines)

          # 카드 상세 페이지 → 앱 데이터 한 줄
          def parse_detail(page):
              subj = re.search(r"<h2\s+id=['\"]subject['\"]>(.*?)</h[1-6]>", page, re.S)
              typ = re.search(r"<h2\s+id=['\"]type['\"]>(.*?)</h[1-6]>", page, re.S)
              if not subj or not typ: return None
              name = clean(subj.group(1))
              parts = [p.strip() for p in clean(typ.group(1)).split("/")]
              if len(parts) < 3: return None
              cid, ty, at = parts[0], TYPE.get(parts[1]), ATTR.get(parts[2])
              if not re.fullmatch(r"[A-Z]+\d*-\d+", cid) or not ty or not at: return None
              ipn = cell(page, "IP")
              ip = IP_NAMES.index(ipn) if ipn in IP_NAMES else 6
              cm = re.search(r"<div\s+id=['\"]content['\"]>(.*?)</div>\s*</td>", page, re.S)
              content = cm.group(1) if cm else ""
              tr = 1 if ("triger_box" in content or re.search(r"<b>\s*트리거\s*</b>\s*/", content)) else 0
              img = re.search(r"id=['\"]img['\"]\s*>\s*<img[^>]*?\ssrc=['\"]([^'\"]+)['\"]", page)
              img_url = ""
              if img:
                  img_url = img.group(1).replace("../", BASE + "/") if img.group(1).startswith("../") else img.group(1)
                  if img_url.startswith("/"): img_url = BASE + img_url
              if ty == "리":
                  aw = re.search(r"리더 레벨이\s*(\d+)\s*이상", content)
                  vow = re.search(r"alt=['\"]서약['\"][^>]*>(.*?)(<br|</p>|$)", content, re.S)
                  seg = vow.group(1) if vow else ""
                  col = re.search(r"alt=['\"](화염|대지|폭풍|파도|번개)['\"]", seg)
                  vt = "M" if "넣어야" in seg else "O"
                  vc = ATTR[col.group(1)] if col else at
                  line = f"{cid}|{name}|리|{at}||||0|{ip}|{aw.group(1) if aw else ''}|{vt}|{vc}"
              else:
                  line = f"{cid}|{name}|{ty}|{at}|{num(cell(page, '코스트'))}|{num(cell(page, '파워'))}|{num(cell(page, '히트'))}|{tr}|{ip}"
              return cid, line, img_url, effect_text(content), content

          # 카드 목록 한 페이지 → 게시글 번호들
          def list_page(n):
              page = get(f"{BASE}/bbs/board.php?bo_table=cardlists&page={n}")
              return [int(x) for x in re.findall(r"data-info=['\"][^'\"]*?♬(\d+)['\"]", page)]

          # 리더 카드 이미지는 기본면(위)과 각성면(아래)이 한 장에 붙어 있음 → 위쪽 기본면만 잘라냄
          def leader_front(im):
              w, h = im.size
              if h <= w: return im                      # 이미 가로 한 장이면 그대로
              g = im.convert("L")
              best, best_y = -1, h // 2
              for y in range(int(h * 0.4), int(h * 0.6)):   # 가운데 근처에서 가장 하얀 가로줄(두 면 사이 틈) 찾기
                  row = [g.getpixel((x, y)) for x in range(0, w, 2)]
                  score = sum(row) / len(row) - (max(row) - min(row)) * 0.3
                  if score > best: best, best_y = score, y
              top = im.crop((0, 0, w, best_y))
              # 아래쪽에 남은 하얀 틈 줄 정리
              while top.height > h * 0.35:
                  row = [g.getpixel((x, top.height - 1)) for x in range(0, w, 2)]
                  if min(row) > 225: top = top.crop((0, 0, w, top.height - 1))
                  else: break
              return top

          # 효과 글 속 아이콘 그림 모으기 (처음 보는 아이콘 이름만 받음)
          def collect_icons(content, icons):
              added = 0
              for tag in re.findall(r"<img[^>]*>", content):
                  a = re.search(r"alt=['\"]([^'\"]*)['\"]", tag)
                  sm = re.search(r"\ssrc=['\"]([^'\"]+)['\"]", tag)
                  if not a or not sm: continue
                  alt, src = a.group(1).strip(), sm.group(1).strip()
                  if not alt or alt in icons: continue
                  if src.startswith("../"): src = "/" + src[3:]
                  url = src if src.startswith("http") else BASE + (src if src.startswith("/") else "/" + src)
                  name = re.sub(r"[^A-Za-z0-9_.-]", "_", os.path.splitext(src.split("?")[0].strip("/"))[0].replace("/", "_")) + ".png"   # 폴더 이름까지 붙여서 겹치지 않게
                  try:
                      if not os.path.exists(os.path.join(ICON_DIR, name)):
                          im = Image.open(io.BytesIO(get(url, binary=True))).convert("RGBA")
                          if im.height > 96: im.thumbnail((400, 96), Image.LANCZOS)
                          im.save(os.path.join(ICON_DIR, name), "PNG", optimize=True)   # 받은 그림을 새로 그려서 저장
                      icons[alt] = name; added += 1
                  except Exception as e:
                      log(f"  아이콘 실패: {alt} ({type(e).__name__})")
              return added

          def save_image(url, cid, leader=False):
              data = get(url, binary=True)
              im = Image.open(io.BytesIO(data)).convert("RGB")
              if leader:
                  im = leader_front(im)
                  im.thumbnail((LEADER_IMG_MAX, LEADER_IMG_MAX), Image.LANCZOS)
              else:
                  im.thumbnail((IMG_MAX, IMG_MAX), Image.LANCZOS)
              im.save(os.path.join(IMG_DIR, cid + ".jpg"), "JPEG", quality=72, optimize=True, progressive=True)

          def main():
              src = open(INDEX, encoding="utf-8").read()
              m = re.search(r"const CARD_DATA = `(.*?)`;", src, re.S)
              if not m: sys.exit("index.html 에서 CARD_DATA 를 찾지 못함")
              data = {l.split("|")[0]: l for l in m.group(1).strip().split("\n") if l.strip()}
              os.makedirs(IMG_DIR, exist_ok=True)
              wr_map = json.load(open(MAP_FILE, encoding="utf-8")) if os.path.exists(MAP_FILE) else {}
              texts = json.load(open(TEXT_FILE, encoding="utf-8")) if os.path.exists(TEXT_FILE) else {}
              icons = json.load(open(ICON_FILE, encoding="utf-8")) if os.path.exists(ICON_FILE) else {}
              os.makedirs(ICON_DIR, exist_ok=True)

              # 1) 목록에서 게시글 번호 모으기 (최신 글부터, 전부 아는 글인 페이지가 나오면 멈춤)
              all_wr, n = [], 1
              while True:
                  ids = list_page(n)
                  if not ids or (all_wr and ids == all_wr[-len(ids):]): break
                  all_wr += ids
                  n += 1
                  if n > 400: break
              new_wr = sorted(i for i in set(all_wr) if str(i) not in wr_map)
              log(f"목록 {n - 1}페이지 확인 · 새 게시글 {len(new_wr)}개")
              if MAX_NEW: new_wr = new_wr[:MAX_NEW]

              # 2) 새 게시글 상세 읽기
              added, mismatch, fail, streak = [], [], 0, 0
              for wr in new_wr:
                  page = ""
                  try:
                      page = get(f"{BASE}/bbs/board.php?bo_table=cardlists&wr_id={wr}")
                      r = parse_detail(page)
                  except Exception as e:
                      r = None
                  if not r:
                      fail += 1; streak += 1
                      head = re.sub(r"\s+", " ", page[:300]) if page else "(응답 없음)"
                      log(f"  읽기 실패: 게시글 {wr} · 받은 길이 {len(page)} · 앞부분: {head}")
                      if streak >= 3:
                          log("  연속 3번 실패해서 이번 실행은 여기서 멈춤")
                          break
                      continue
                  streak = 0
                  cid, line, img_url, text, content = r
                  collect_icons(content, icons)
                  wr_map[str(wr)] = [cid, img_url]
                  if cid not in texts and text: texts[cid] = text
                  if cid not in data:
                      data[cid] = line; added.append(line)
                  elif data[cid] != line and line not in mismatch:
                      mismatch.append(f"{data[cid]}  ⇢  {line}")

              # 2-2) 효과 글이 아직 없는 카드는 (같은 카드 중 번호가 가장 작은) 게시글을 다시 읽어서 효과 글만 채움
              first_wr = {}
              for wr in sorted(wr_map, key=int):
                  cid = wr_map[wr][0]
                  if cid not in first_wr: first_wr[cid] = wr
              need = [(cid, wr) for cid, wr in sorted(first_wr.items()) if cid not in texts]
              if MAX_NEW: need = need[:MAX_NEW]
              got_text, streak = 0, 0
              for cid, wr in need:
                  try:
                      r = parse_detail(get(f"{BASE}/bbs/board.php?bo_table=cardlists&wr_id={wr}"))
                  except Exception:
                      r = None
                  if r and r[0] == cid:
                      texts[cid] = r[3]; got_text += 1; streak = 0
                      collect_icons(r[4], icons)
                  else:
                      streak += 1; log(f"  효과 글 실패: {cid} (게시글 {wr})")
                      if streak >= 3:
                          log("  연속 3번 실패해서 효과 글 수집은 여기서 멈춤"); break
              log(f"효과 글 {got_text}장 새로 저장 · 전체 {len(texts)}장")

              # 2-3) 효과 글에 나오는데 아직 그림이 없는 아이콘 → 그 아이콘이 나오는 카드 페이지를 다시 읽어서 받음
              def missing_icons():
                  return {m for v in texts.values() for m in re.findall(r"⟦([^⟧]*)⟧", v) if m.strip() and m.strip() not in icons}
              miss, tried, streak = missing_icons(), 0, 0
              for cid, wr in sorted(first_wr.items()):
                  if not miss: break
                  if not any("⟦" + m + "⟧" in texts.get(cid, "") for m in miss): continue
                  try:
                      r = parse_detail(get(f"{BASE}/bbs/board.php?bo_table=cardlists&wr_id={wr}"))
                  except Exception:
                      r = None
                  tried += 1
                  if r: collect_icons(r[4], icons); streak = 0
                  else:
                      streak += 1
                      if streak >= 3: log("  연속 3번 실패해서 아이콘 수집은 여기서 멈춤"); break
                  miss = missing_icons()
              log(f"아이콘 {len(icons)}종 · 이번에 페이지 {tried}개 확인 · 아직 없는 아이콘 {len(miss)}종 {sorted(miss)[:10]}")

              # 3) 이미지 없는 카드 이미지 받기 (같은 카드는 번호가 가장 작은 게시글 이미지)
              first = {}
              for wr in sorted(wr_map, key=int):
                  cid, url = wr_map[wr]
                  if url and cid not in first: first[cid] = url
              got = 0
              for cid, url in sorted(first.items()):
                  path = os.path.join(IMG_DIR, cid + ".jpg")
                  leader = cid in data and data[cid].split("|")[2] == "리"
                  if os.path.exists(path):
                      if not leader: continue
                      with Image.open(path) as old:
                          if old.width >= old.height: continue      # 이미 기본면만 잘라둔 리더 이미지
                  try: save_image(url, cid, leader); got += 1
                  except Exception as e: log(f"  이미지 실패: {cid}")

              # 4) 저장
              open(ICON_FILE, "w", encoding="utf-8").write(json.dumps(dict(sorted(icons.items())), ensure_ascii=False, indent=0) + "\n")
              open(TEXT_FILE, "w", encoding="utf-8").write("{\n" + ",\n".join(json.dumps(k) + ": " + json.dumps(v, ensure_ascii=False) for k, v in sorted(texts.items())) + "\n}\n")
              open(MAP_FILE, "w", encoding="utf-8").write("{\n" + ",\n".join(json.dumps(k) + ": " + json.dumps(v, ensure_ascii=False) for k, v in sorted(wr_map.items(), key=lambda kv: int(kv[0]))) + "\n}\n")
              if added:
                  body = "\n".join(data[k] for k in sorted(data)).replace("`", "'").replace("${", "$ {")
                  src = src[:m.start(1)] + body + src[m.end(1):]
                  ver = time.strftime("%Y%m%d-%H%M", time.gmtime(time.time() + 9 * 3600))
                  src = re.sub(r'const APP_VERSION = "\d{8}-\d{4}"', f'const APP_VERSION = "{ver}"', src, count=1)
                  open(INDEX, "w", encoding="utf-8").write(src)

              log(f"새 카드 {len(added)}장 추가 · 이미지 {got}장 저장 · 읽기 실패 {fail}개 · 전체 이미지 {len([f for f in os.listdir(IMG_DIR) if f.endswith('.jpg')])}장")
              for a in added: log("  추가: " + a)
              if mismatch:
                  log(f"앱 데이터와 공식 사이트가 다른 카드 {len(mismatch)}장 (자동으로 고치지 않음, 확인용):")
                  for x in mismatch[:200]: log("  " + x)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("### 카드 자동 업데이트 결과\n```\n" + "\n".join(log_lines) + "\n```\n")

          if __name__ == "__main__":
              main()
          PY
          python3 /tmp/update_cards.py

      - name: 공식 Q&A(재정) 가져오기
        continue-on-error: true
        run: |
          cat > /tmp/update_qna.py <<'PY'
          # 니벨아레나 뉴런 - 공식 Q&A(재정) 자동 업데이트
          # 공식 홈페이지 공식정보 → Q&A 게시판 전체를 읽어서 cards/qna.json 으로 저장
          # (질문 · 답변 · 분류 · 날짜 · 관련 카드 번호)
          import html, json, os, re, sys, time, urllib.request

          BASE = "http://nivelarena.co.kr"
          LIST = BASE + "/bbs/board.php?bo_table=qna&page={}"
          OUT = "cards/qna.json"
          SLEEP = 1.0                     # 요청 간격(초) - 사이트에 부담 안 주게 천천히
          MAX_PAGES = 80                  # 안전장치
          UA = "Mozilla/5.0 (NivelNeuron qna sync)"   # 카드 자동 업데이트와 같은 형식 (니벨 뉴런임을 밝힘)
          ID_RE = re.compile(r"\b([A-Z]{2}\d{2}-\d{3})\b")

          log_lines = []
          def log(s):
              print(s, flush=True); log_lines.append(s)

          def get(url):
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:
                      log(f"  읽기 실패 ({i + 1}/3): {url} - {e}")
                      time.sleep(3)
              return None

          # 답변 HTML → 글자 (문단은 줄바꿈, <EX> 같은 키워드 표기는 그대로 둠)
          HTML_TAGS = r"(?:p|br|span|div|font|strong|b|em|i|u|a|img|ul|ol|li|table|tr|td|th|tbody|thead|h\d|sup|sub|small|center)"
          def to_text(h):
              h = re.sub(r"(?is)<\s*br\s*/?\s*>", "\n", h)
              h = re.sub(r"(?is)</\s*p\s*>|</\s*div\s*>|</\s*li\s*>", "\n", h)
              h = re.sub(r"(?is)<\s*/?\s*(?:strong|b)\s*>", "**", h)
              h = re.sub(r"(?is)<\s*/?\s*" + HTML_TAGS + r"\b[^<>]*>", "", h)
              t = html.unescape(h).replace("\xa0", " ")
              t = re.sub(r"\*\*\s*\*\*", "", t)
              lines = [re.sub(r"[ \t]+", " ", x).strip() for x in t.split("\n")]
              return "\n".join(x for x in lines if x)

          def parse(page):
              i = page.find("faq_list_board")
              if i < 0: return []
              j = page.find("</ul>", i)
              block = page[i: j if j > 0 else len(page)]
              out = []
              for li in re.split(r"(?i)<li\b[^>]*>", block)[1:]:
                  mq = re.search(r"""(?is)<p[^>]*class\s*=\s*["']?q["']?[^>]*>(.*?)</p>""", li)
                  ma = re.search(r"""(?is)<div[^>]*class\s*=\s*["']?desc["']?[^>]*>(.*)</div>\s*</div>""", li) \
                      or re.search(r"""(?is)<div[^>]*class\s*=\s*["']?answer["']?[^>]*>(.*)</div>""", li)
                  if not mq or not ma: continue
                  qh = mq.group(1)
                  mc = re.search(r"""(?is)<span[^>]*class\s*=\s*["']?cate_name["']?[^>]*>(.*?)</span>""", qh)
                  cat = to_text(mc.group(1)) if mc else ""
                  qh = re.sub(r"""(?is)<span[^>]*class\s*=\s*["']?(?:qt|cate_name)["']?[^>]*>.*?</span>""", "", qh)
                  q = re.sub(r"\s+", " ", to_text(qh)).strip()
                  md = re.search(r"\((\d{4})\.(\d{1,2})\.(\d{1,2})\)\s*$", q)
                  d = ""
                  if md:
                      d = f"{md.group(1)}.{int(md.group(2)):02d}.{int(md.group(3)):02d}"
                      q = q[:md.start()].rstrip()
                  a = to_text(ma.group(1))
                  ids = []
                  for x in ID_RE.findall(q + "\n" + a):
                      if x not in ids: ids.append(x)
                  out.append({"c": cat, "q": q, "a": a, "d": d, "ids": ids})
              return out

          def main():
              allq = []
              for p in range(1, MAX_PAGES + 1):
                  page = get(LIST.format(p))
                  if page is None:
                      log(f"{p}페이지를 읽지 못해서 이번에는 Q&A를 바꾸지 않음"); return 1
                  items = parse(page)
                  if not items: break
                  allq.extend(items)
                  time.sleep(SLEEP)
              if len(allq) < 50:
                  log(f"Q&A가 {len(allq)}개뿐이라 이상해서 저장하지 않음"); return 1
              old = None
              if os.path.exists(OUT):
                  try: old = json.load(open(OUT, encoding="utf-8"))
                  except Exception: old = None
              data = {"items": allq}
              if old and old.get("items") == allq:
                  log(f"Q&A {len(allq)}개 · 바뀐 것 없음")
              else:
                  os.makedirs("cards", exist_ok=True)
                  with open(OUT, "w", encoding="utf-8") as f:
                      f.write('{"items": [\n' + ",\n".join(json.dumps(x, ensure_ascii=False) for x in allq) + "\n]}\n")
                  log(f"Q&A {len(allq)}개 저장 (이전 {len(old['items']) if old else 0}개)")
              cats = {}
              for x in allq: cats[x["c"]] = cats.get(x["c"], 0) + 1
              log("분류: " + ", ".join(f"{k} {v}" for k, v in cats.items()))
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("### Q&A 자동 업데이트 결과\n```\n" + "\n".join(log_lines) + "\n```\n")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 /tmp/update_qna.py

      - name: 바뀐 내용 올리기
        run: |
          git config user.name "card-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html cards
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "카드 자동 업데이트"
            # 실행하는 동안 다른 파일이 올라왔으면 먼저 합친 뒤 올림
            git pull --rebase origin main
            git push
          fi
